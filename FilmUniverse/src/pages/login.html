<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | CineSocial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #00d474;
            --secondary: #1a1a1a;
            --dark: #0d0d0d;
            --light: #f8f9fa;
            --gray: #333333;
            --light-gray: #666666;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--dark);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background-color: var(--secondary);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }
        
        .auth-header p {
            color: var(--light-gray);
        }
        
        .auth-logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .auth-logo span {
            color: var(--light);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--dark);
            border: 1px solid var(--gray);
            color: var(--light);
            border-radius: 4px;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn-auth {
            width: 100%;
            padding: 0.75rem;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: var(--dark);
            border: none;
        }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--light);
            border: 1px solid var(--light-gray);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--light-gray);
        }
        
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--light-gray);
        }
        
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--gray);
        }
        
        .divider::before {
            margin-right: 1rem;
        }
        
        .divider::after {
            margin-left: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">Cine<span>Social</span></div>
            <h1>Iniciar Sesión</h1>
            <p>Accede a tu cuenta para continuar</p>
        </div>
        
        <form>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="tu@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-auth btn-primary">Iniciar sesión</button>
            
            <div class="divider">o</div>
            
            <button type="button" class="btn-auth btn-secondary">
                <i class="fab fa-google"></i> Continuar con Google
            </button>
            
            <div class="auth-footer">
                ¿No tienes una cuenta? <a href="registro.html">Regístrate</a>
            </div>
        </form>
    </div>
</body>
</html>
