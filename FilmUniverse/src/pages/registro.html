<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Mismo head que login.html -->
    <title>Registro | CineSocial</title>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">Cine<span>Social</span></div>
            <h1>Crear Cuenta</h1>
            <p>Únete a nuestra comunidad cinéfila</p>
        </div>
        
        <form>
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" class="form-control" placeholder="juan_cinefilo">
            </div>
            
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="tu@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirmar contraseña</label>
                <input type="password" id="confirm-password" class="form-control" placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-auth btn-primary">Registrarse</button>
            
            <div class="divider">o</div>
            
            <button type="button" class="btn-auth btn-secondary">
                <i class="fab fa-google"></i> Continuar con Google
            </button>
            
            <div class="auth-footer">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </form>
    </div>
</body>
</html>
